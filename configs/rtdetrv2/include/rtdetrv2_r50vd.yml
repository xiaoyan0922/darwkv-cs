task: detection

model: RTDETR
criterion: RTDETRCriterionv2
postprocessor: RTDETRPostProcessor


use_focal_loss: True
eval_spatial_size: [640, 640] # h w


RTDETR: 
  backbone: PResNet
  encoder: HybridEncoder
  decoder: RTDETRTransformerv2
  

PResNet:
  depth: 50
  variant: d
  freeze_at: 0
  return_idx: [1, 2, 3]
  num_stages: 4
  freeze_norm: True
  pretrained: True 


HybridEncoder:
  use_domain_decay: False
  domain_decay_max_delta: 0.5
  domain_decay_proto_tau: 0.07
  in_channels: [512, 1024, 2048]
  feat_strides: [8, 16, 32]

  # intra
  hidden_dim: 256
  # PResNet returns [C3, C4, C5], so [1, 2] applies V-RWKV on C4/C5.
  encoder_type: vrwkv
  use_encoder_idx: [1, 2]
  num_encoder_layers: 5
  nhead: 4
  dim_feedforward: 1024
  dropout: 0.
  enc_act: 'gelu'
  
  # cross
  expansion: 1.0
  depth_mult: 1
  act: 'silu'


RTDETRTransformerv2:
  feat_channels: [256, 256, 256]
  feat_strides: [8, 16, 32]
  hidden_dim: 256
  num_levels: 3

  num_layers: 6
  num_queries: 300

  num_denoising: 100
  label_noise_ratio: 0.5
  box_noise_scale: 1.0 # 1.0 0.4

  eval_idx: -1

  # NEW
  num_points: [4, 4, 4] # [3,3,3] [2,2,2]
  cross_attn_method: default # default, discrete
  query_select_method: default # default, agnostic 


RTDETRPostProcessor:
  num_top_queries: 300


RTDETRCriterionv2:
  use_contrastive_loss: False
  use_slot_self_distill: False
  use_slot_cross_view: False
  slot_distill_momentum: 0.99
  slot_distill_num_prototypes: 25
  slot_distill_teacher_temp: 0.04
  slot_distill_student_temp: 0.1
  slot_cross_view_temp: 0.1
  weight_dict: {loss_vfl: 1, loss_bbox: 5, loss_giou: 2, loss_reconstruction_l2: 1, loss_contrastive: 0.05, loss_slot_self_distill: 0.02, loss_slot_cross_view: 0.05}
  losses: ['vfl', 'boxes', 'reconstruction', ]
  alpha: 0.75
  gamma: 2.0

  matcher:
    type: HungarianMatcher
    weight_dict: {cost_class: 2, cost_bbox: 5, cost_giou: 2}
    alpha: 0.25
    gamma: 1.5

