__include__: [
  '../dataset/coco_detection_sim2c.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/rtdetrv2_r50vd.yml',
]

epoches: 72
output_dir: ./output/pretraining_sim2c_rwkv_slot

dinosaur_checkpoint: "importantpt/hsa.pt"
dinosaur_isa: False
dinosaur_lr: 1e-5

use_teacher: False
use_HSA: True

HybridEncoder:
  use_domain_decay: False
  domain_decay_max_delta: 0.4
  domain_decay_proto_tau: 0.1
  use_encoder_idx: [1, 2]       # 建议加上
  num_classes: 1

RTDETRTransformerv2:
  contrastive_loss: False
  HSA: True

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm).*$'
      lr: 0.00001
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.0001

