task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 1
remap_mscoco_category: True

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /data/TeamMember/wgh/ycy/CGSA-main/data/sim10k/JPEGImages/
    ann_file: /data/TeamMember/wgh/ycy/CGSA-main/data/sim10k/annotations/sim10k_train_cocostyle.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFuncion

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /data/TeamMember/wgh/ycy/CGSA-main/data/cityscapes/leftImg8bit/val/
    ann_file: /data/TeamMember/wgh/ycy/CGSA-main/data/cityscapes/annotations/cityscapes_val_caronly.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFuncion